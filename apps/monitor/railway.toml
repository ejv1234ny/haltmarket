## Railway config for haltmarket-monitor.
##
## Set the Railway service's "Root Directory" to `apps/monitor` in the
## Railway dashboard. This toml assumes that context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "haltmarket-monitor"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 30
