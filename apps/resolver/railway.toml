## Railway config for haltmarket-resolver.
##
## Set the Railway service's "Root Directory" to `apps/resolver` in the
## Railway dashboard. This toml assumes that context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "haltmarket-resolver"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/healthz"
healthcheckTimeout = 30
